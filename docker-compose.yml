services:

  db:
    image: postgres:17
    container_name: fleetflow_postgres
    restart: always

    environment:
      POSTGRES_DB: fleetflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sangamesh@445

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: fleetflow_backend
    restart: always

    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles

    ports:
      - "8000:8000"

    depends_on:
      - db

  frontend:
    build:
      context: ./frontend

    container_name: fleetflow_frontend
    restart: always

    depends_on:
      - backend

  nginx:
    image: nginx:alpine

    container_name: fleetflow_nginx
    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro

    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_volume: